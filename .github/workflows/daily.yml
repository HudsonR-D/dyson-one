name: daily-ledger

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Observe
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m dyson_one observe --out data --limit 60 --lookup 12
      - name: Commit snapshot
        run: |
          git config user.name "dyson-one-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/BRIEF.md data/ledger.jsonl
          if [ -f data/previous.json ]; then git add data/previous.json; fi
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "chore: refresh Dyson One world"
            git push
          fi
