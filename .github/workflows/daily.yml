name: daily-ledger

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m dyson_one observe --out data
      - name: Commit snapshot
        run: |
          git config user.name "dyson-one-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/previous.json data/BRIEF.md data/ledger.jsonl
          git diff --cached --quiet || git commit -m "chore: refresh Dyson One world"
          git push
